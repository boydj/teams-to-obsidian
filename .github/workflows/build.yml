name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (macOS)
    # Apple Silicon runner; the project targets macOS 14.4+.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v5

      # aws-sdk-swift is a large dependency tree — caching .build and the
      # SwiftPM cache cuts rebuilds from ~20 minutes to ~2.
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: make build

      - name: Test
        run: swift test

      - name: Assemble and ad-hoc sign app bundle
        run: make sign

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/TeamsToObsidian.app dist/TeamsToObsidian.app.zip

      # Base64-encoded sha256 of the artifact, consumed by the SLSA generator.
      # (BSD shasum/base64 on macOS: same "hash  name" format, no line wrapping.)
      - name: Compute artifact digest
        id: hash
        run: echo "hashes=$(cd dist && shasum -a 256 TeamsToObsidian.app.zip | base64)" >> "$GITHUB_OUTPUT"

      - name: Upload app artifact
        uses: actions/upload-artifact@v5
        with:
          name: TeamsToObsidian.app
          path: dist/TeamsToObsidian.app.zip

  # Real whisper.cpp (tiny.en) + stub Ollama + assertions on the produced
  # note — the automatable part of the README's verification ladder. Capture
  # and detection can't run here (no TCC grants / audio devices on runners).
  e2e:
    name: End-to-end pipeline (macOS)
    needs: [build]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Cache whisper.cpp
        uses: actions/cache@v5
        with:
          path: ~/.local/share/teams-to-obsidian/whisper.cpp
          key: whisper-${{ runner.os }}-tiny.en-1

      - name: Build
        run: make build

      - name: Set up whisper.cpp (tiny.en)
        run: TTO_WHISPER_MODEL=tiny.en ./scripts/setup-whisper.sh

      - name: Run end-to-end pipeline test
        run: ./scripts/ci/e2e-pipeline-test.sh

  lint-scripts:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck (errors only)
        run: shellcheck --severity=error scripts/*.sh scripts/ci/*.sh

  # SLSA Build L3 provenance for the zipped app bundle, generated in the
  # isolated reusable workflow and uploaded as <name>.intoto.jsonl. Verify a
  # downloaded artifact with slsa-verifier:
  #   slsa-verifier verify-artifact TeamsToObsidian.app.zip \
  #     --provenance-path TeamsToObsidian.app.zip.intoto.jsonl \
  #     --source-uri github.com/boydj/teams-to-obsidian
  provenance:
    name: SLSA provenance
    needs: [build]
    # Callers must grant everything the reusable workflow's jobs declare —
    # including contents: write for its (unused here) release-upload path.
    permissions:
      actions: read      # detect the GitHub Actions environment
      id-token: write    # sign the provenance via Sigstore
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: TeamsToObsidian.app.zip.intoto.jsonl
      # No-op while the repo is public; if it ever goes private again, this
      # stays the required opt-in (signing puts the repo NAME in the public
      # Rekor transparency log).
      private-repository: true
